<text x="409.4" y="418" text-anchor="middle" class="label">32K</text>
<rect x="532.6" y="300.7" width="76" height="87.3" rx="4" fill="#2563eb"/>
<text x="570.6" y="292.7" text-anchor="middle" class="value">23.8</text>
<rect x="622.6" y="284.4" width="76" height="103.6" rx="4" fill="#f97316"/>
